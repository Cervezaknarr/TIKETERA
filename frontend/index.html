<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticketera</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/event.css">
</head>
<body>
<header>
  <h1>🎟️ Ticketera</h1>
  <nav id="nav"><button class="ghost" onclick="go('events')">Eventos</button></nav>
</header>
<main>
  <div id="msg"></div>
  <div id="view"></div>
</main>

<script src="/common.js"></script>
<script>
// Sitio de los visitantes: ven los eventos, compran sin cuenta y ven sus entradas
// con el link privado que les llega. El staff entra por /staff y el admin por /admin
function go(view, arg) {
  flash('');
  // Solo la vista de entradas tiene URL propia (es el link que llega por email)
  if (view !== 'tickets' && location.hash) history.replaceState(null, '', location.pathname);
  // En la URL de un evento (/e/<slug>) el inicio es su compra, no el listado
  if (view === 'events' && eventSlug) { view = 'buy'; arg = eventSlug; }
  ({ events: viewEvents, buy: viewBuy, tickets: viewTickets }[view])(arg);
}
const eventSlug = (location.pathname.match(/^\/e\/([^/]+)/) || [])[1];
if (eventSlug) { // la URL de un evento tiene su propio diseño y no lleva al listado
  document.body.classList.add('ev');
  $('nav').style.display = 'none';
}

// ---------- Eventos ----------
async function viewEvents() {
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    const { events } = await api('/events?limit=100&status=published');
    $('view').innerHTML = `<h2>Próximos eventos</h2>` + (events.length
      ? `<div class="grid">${events.map(e => `
        <div class="card">
          <h3>${esc(e.title)}</h3>
          <div class="muted">📅 ${new Date(e.date).toLocaleString('es-AR')}<br>📍 ${esc(e.location)}</div>
          <p>${esc(e.description)}</p>
          <div class="lots">${e.lots.map(l => `
            <div class="lot ${l.ticketsAvailable < 1 ? 'sold' : ''}">
              <b>${esc(l.name)}</b>
              ${l.ticketsAvailable < 1 ? '<span class="tag soldout">Agotada</span>' : `<span class="price" style="margin:0">${money(l.price)}</span>`}
            </div>`).join('')}</div>
          <p><button ${e.ticketsAvailable < 1 ? 'disabled' : ''} onclick="location.href='/e/${e.slug || e.id}'">${e.ticketsAvailable < 1 ? 'Agotado' : 'Comprar'}</button></p>
        </div>`).join('')}</div>`
      : '<p class="muted">Todavía no hay eventos a la venta.</p>');
  } catch (err) { $('view').innerHTML = ''; flash(err.message, 'err'); }
}

// Todos los eventos son en el mismo lugar (Club Universitario de La Plata): mapa de Google
// embebido, sin API key. Para cambiarlo: Google Maps > Compartir > Insertar un mapa > copiar el src
const EVENT_MAP_SRC = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6546.049845049984!2d-58.01646536762052!3d-34.88072047542471!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95a2ddf0f0f47e75%3A0x8a17dcfbc1548515!2sClub%20Universitario%20de%20La%20Plata!5e0!3m2!1ses-419!2sar!4v1792817682053!5m2!1ses-419!2sar";

function mapBlock(e) {
  return `
    <div class="ev-map">
      <iframe title="Mapa de ${esc(e.location)}" src="${EVENT_MAP_SRC}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>`;
}

// ---------- Compra ----------
let currentEvent = null;
async function viewBuy(id) {
  try {
    ({ event: currentEvent } = await api('/events/' + id));
  } catch (err) { return flash(err.message, 'err'); }
  const e = currentEvent;
  const firstFree = e.lots.find(l => l.ticketsAvailable > 0);
  document.title = e.title;
  const when = new Date(e.date).toLocaleString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  // Cada tipo de entrada tiene su select de cantidad (1 a 10, sin pasar el cupo).
  // Una compra es de un solo tipo: al tocar la tarjeta o su select, ese tipo queda elegido
  const lotCard = l => {
    const max = Math.min(l.ticketsAvailable, 10);
    return `
      <label class="ev-lot ${max < 1 ? 'sold' : ''}">
        <input type="radio" name="bLot" value="${l.id}" ${l === firstFree ? 'checked' : ''} ${max < 1 ? 'disabled' : ''} onchange="updTotal()">
        <span class="ev-lot-info">
          <span class="ev-lot-name">${esc(l.name)}</span>
          <span class="ev-lot-price">${max < 1 ? '<span class="ev-soldtag">Agotada</span>' : money(l.price)}</span>
        </span>
        ${max < 1 ? '' : `<span class="ev-lot-qty"><span>Cantidad</span>
          <select data-lot="${l.id}" aria-label="Cantidad de ${esc(l.name)}" onchange="pickLot('${l.id}')">
            ${Array.from({ length: max }, (_, i) => `<option>${i + 1}</option>`).join('')}
          </select></span>`}
      </label>`;
  };
  $('view').innerHTML = `
  <div class="ev-hero ${e.imageUrl ? '' : 'no-cover'}">${e.imageUrl ? `<img src="${esc(e.imageUrl)}" alt="Portada de ${esc(e.title)}">` : ''}</div>
  <div class="ev-layout">
    <section>
      <h2 class="ev-title">${esc(e.title)}</h2>
      <div class="ev-meta">
        <span class="ev-chip">📅 ${esc(when)}</span>
        <span class="ev-chip">📍 ${esc(e.location)}</span>
      </div>
      <p class="ev-desc">${esc(e.description)}</p>
      ${mapBlock(e)}
    </section>
    <form class="ev-panel" onsubmit="submitBuy(event)">
      <h2>Entradas</h2>
      <div class="ev-lots">${e.lots.map(lotCard).join('')}</div>
      <label for="bName">Nombre</label><input id="bName" required autocomplete="name">
      <label for="bEmail">Email</label><input id="bEmail" type="email" required autocomplete="email">
      <p class="ev-note">Al continuar te llevamos a la pasarela de pago. En modo de prueba el pago se aprueba automáticamente.</p>
      <div class="ev-pay">
        <div class="ev-total"><small>Total</small><b id="bTotal"></b></div>
        <button class="ev-btn" ${firstFree ? '' : 'disabled'}>Pagar</button>
      </div>
    </form>
  </div>`;
  updTotal();
}
const selectedLot = () => {
  const r = document.querySelector('input[name="bLot"]:checked');
  return r && currentEvent.lots.find(l => l.id === r.value);
};
const lotQty = lot => Number(document.querySelector(`select[data-lot="${lot.id}"]`).value);
// Elegir la cantidad de un tipo de entrada también elige ese tipo
function pickLot(id) {
  document.querySelector(`input[name="bLot"][value="${id}"]`).checked = true;
  updTotal();
}
function updTotal() {
  const lot = selectedLot();
  $('bTotal').textContent = lot ? money(lot.price * lotQty(lot)) : '';
}

async function submitBuy(ev) {
  ev.preventDefault();
  try {
    const lot = selectedLot();
    if (!lot) throw new Error('Elegí un tipo de entrada');
    const { purchase, checkoutUrl } = await api('/purchases/checkout', { method: 'POST', body: {
      eventId: currentEvent.id, lotId: lot.id, buyerName: $('bName').value,
      buyerEmail: $('bEmail').value, quantity: lotQty(lot),
    }});
    // Pasarela real: se redirige a pagar y vuelve al link de las entradas
    if (checkoutUrl) { location.href = checkoutUrl; return; }
    // Sin checkoutUrl (modo de prueba): se simula la pasarela confirmando el cobro
    await api('/purchases/webhook', { method: 'POST', body: { paymentGatewayId: purchase.paymentGatewayId, status: 'approved' } });
    go('tickets', purchase.accessToken);
    flash('¡Compra realizada! Estas son tus entradas.');
  } catch (err) { flash(err.message, 'err'); }
}

// ---------- Mis entradas (link privado de la compra) ----------
async function viewTickets(token, tries = 0) {
  history.replaceState(null, '', '#/entradas/' + token);
  if (!tries) $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    const { purchase, event, tickets } = await api('/purchases/tickets/' + encodeURIComponent(token));
    const statusText = { valid: 'Válida', used: 'Ya ingresó', void: 'Anulada' };
    $('view').innerHTML = `
    <div style="max-width:420px;margin:auto">
      <div class="card">
        <h2>${esc(event.title)}</h2>
        <p class="muted">📅 ${new Date(event.date).toLocaleString('es-AR')}<br>📍 ${esc(event.location)}</p>
        <p class="muted">${esc(purchase.buyerName)} · ${purchase.quantity} entrada(s)${purchase.lotName ? ` ${esc(purchase.lotName)}` : ''} · ${money(purchase.totalPrice)}</p>
        ${tickets.length ? '<p class="muted">Cada QR es para una persona. También te llegan por email.</p>'
          : purchase.status === 'failed' ? '<p class="msg err">El pago no se completó. Volvé al evento para intentarlo de nuevo.</p>'
          : `<p class="muted">Estamos confirmando tu pago… esta página se actualiza sola.</p>
             ${purchase.expiresAt ? `<p class="msg hold" id="hold" data-exp="${esc(purchase.expiresAt)}"></p>` : ''}`}
      </div>
      ${tickets.map((t, i) => `
      <div class="card ticket" style="margin-top:14px">
        <div class="muted">Entrada ${i + 1} de ${tickets.length} · ${statusText[t.status]}</div>
        <img class="qr" src="${t.qr}" alt="QR ${esc(t.code)}">
        <p class="tcode">${esc(t.code)}</p>
      </div>`).join('')}
      <p style="text-align:center"><button class="ghost" onclick="go('events')">${eventSlug ? 'Volver al evento' : 'Volver a eventos'}</button></p>
    </div>`;
    startHoldTimer();
    // Al volver de la pasarela el aviso del pago puede tardar unos segundos: se reintenta solo
    if (!tickets.length && purchase.status === 'pending' && tries < 20) {
      setTimeout(() => { if (location.hash === '#/entradas/' + token) viewTickets(token, tries + 1); }, 3000);
    }
  } catch (err) { $('view').innerHTML = ''; flash(err.message, 'err'); }
}

// Cuenta regresiva de la reserva: las entradas se guardan unos minutos mientras se paga
let holdTimer;
function startHoldTimer() {
  clearInterval(holdTimer);
  const el = $('hold');
  if (!el) return;
  const exp = new Date(el.dataset.exp).getTime();
  const tick = () => {
    const left = Math.max(0, Math.round((exp - Date.now()) / 1000));
    if (left > 0) {
      el.className = 'msg hold';
      el.textContent = `⏳ Tu reserva se mantiene ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} más. Completá el pago antes de que venza.`;
    } else {
      clearInterval(holdTimer);
      el.className = 'msg err';
      el.textContent = 'La reserva venció y las entradas se liberaron. Si ya pagaste, esperá unos segundos; si no, volvé al evento para intentarlo de nuevo.';
    }
  };
  tick();
  holdTimer = setInterval(tick, 1000);
}

// Al volver del pago, Mercado Pago agrega sus parámetros después del token
// (#/entradas/<token>?payment_id=...&status=approved...): se ignoran
const ticketsLink = location.hash.match(/^#\/entradas\/([\w-]+)(?:\?.*)?$/);
ticketsLink ? go('tickets', ticketsLink[1]) : go('events');
</script>
</body>
</html>
