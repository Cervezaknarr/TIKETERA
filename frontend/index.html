<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticketera</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/event.css">
</head>
<body>
<header>
  <h1>🎟️ Ticketera</h1>
  <nav id="nav"><button class="ghost" onclick="go('events')">Eventos</button></nav>
</header>
<main>
  <div id="msg"></div>
  <div id="view"></div>
</main>

<script src="/common.js"></script>
<script>
// Sitio de los visitantes: ven los eventos, compran sin cuenta y ven sus entradas
// con el link privado que les llega. El staff entra por /staff y el admin por /admin
function go(view, arg) {
  flash('');
  // Solo la vista de entradas tiene URL propia (es el link que llega por email)
  if (view !== 'tickets' && location.hash) history.replaceState(null, '', location.pathname);
  // En la URL de un evento (/e/<slug>) el inicio es su compra, no el listado
  if (view === 'events' && eventSlug) { view = 'buy'; arg = eventSlug; }
  ({ events: viewEvents, buy: viewBuy, tickets: viewTickets }[view])(arg);
}
const eventSlug = (location.pathname.match(/^\/e\/([^/]+)/) || [])[1];
if (eventSlug) { // la URL de un evento tiene su propio diseño y no lleva al listado
  document.body.classList.add('ev');
  $('nav').style.display = 'none';
}

// Fecha de un evento, igual en el listado, la compra y "Mis entradas" (sin segundos)
const fmtWhen = d => new Date(d).toLocaleString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });

// ---------- Eventos ----------
async function viewEvents() {
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    const { events } = await api('/events?limit=100&status=published');
    $('view').innerHTML = `<h2>Próximos eventos</h2>` + (events.length
      ? `<div class="grid">${events.map(e => `
        <div class="card">
          <h3>${esc(e.title)}</h3>
          <div class="muted">📅 ${esc(fmtWhen(e.date))}<br>📍 ${esc(e.location)}</div>
          <p>${esc(e.description)}</p>
          <div class="lots">${e.lots.map(l => `
            <div class="lot ${l.ticketsAvailable < 1 ? 'sold' : ''}">
              <b>${esc(l.name)}</b>
              ${l.ticketsAvailable < 1 ? '<span class="tag soldout">Agotada</span>' : `<span class="price" style="margin:0">${money(l.price)}</span>`}
            </div>`).join('')}</div>
          <p><button ${e.ticketsAvailable < 1 ? 'disabled' : ''} onclick="location.href='/e/${e.slug || e.id}'">${e.ticketsAvailable < 1 ? 'Agotado' : 'Comprar'}</button></p>
        </div>`).join('')}</div>`
      : '<p class="muted">Todavía no hay eventos a la venta.</p>');
  } catch (err) { $('view').innerHTML = ''; flash(err.message, 'err'); }
}

// Todos los eventos son en el mismo lugar (Club Universitario de La Plata): mapa de Google
// embebido, sin API key. Para cambiarlo: Google Maps > Compartir > Insertar un mapa > copiar el src
const EVENT_MAP_SRC = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6546.049845049984!2d-58.01646536762052!3d-34.88072047542471!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95a2ddf0f0f47e75%3A0x8a17dcfbc1548515!2sClub%20Universitario%20de%20La%20Plata!5e0!3m2!1ses-419!2sar!4v1792817682053!5m2!1ses-419!2sar";

function mapBlock(e) {
  return `
    <div class="ev-map">
      <iframe title="Mapa de ${esc(e.location)}" src="${EVENT_MAP_SRC}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>`;
}

// Portada por defecto: el día del evento en grande
function datePoster(date) {
  const d = new Date(date);
  const month = d.toLocaleString('es-AR', { month: 'long' });
  const time = d.toLocaleString('es-AR', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  return `<div class="ev-poster" aria-hidden="true">
    <span class="ev-poster-day">${d.getDate()}</span>
    <span class="ev-poster-month">${esc(month)}</span>
    <span class="ev-poster-time">${esc(time)} hs</span>
  </div>`;
}

// ---------- Compra ----------
// Dos pasos, como un carrito: 1) elegir cuántas entradas de cada tipo, 2) resumen con los
// datos del comprador y un reloj. Una compra puede mezclar tipos (2 Generales y 3 VIP)
const MAX_PER_PURCHASE = 10;   // el servidor aplica el mismo tope (MAX_TICKETS_PER_PURCHASE)
const CHECKOUT_MINUTES = 10;   // tiempo para completar los datos en el resumen
let currentEvent = null;
let cart = {};                 // lotId -> cantidad
let checkoutTimer = null;

const cartLines = () => (currentEvent ? currentEvent.lots : [])
  .filter(l => cart[l.id] > 0).map(l => ({ lot: l, quantity: cart[l.id] }));
const cartCount = () => cartLines().reduce((n, x) => n + x.quantity, 0);
const cartTotal = () => cartLines().reduce((s, x) => s + x.lot.price * x.quantity, 0);

async function viewBuy(id) {
  clearInterval(checkoutTimer);
  try {
    ({ event: currentEvent } = await api('/events/' + id));
  } catch (err) { return flash(err.message, 'err'); }
  const e = currentEvent;
  // Si el evento cambió mientras tanto, la selección se ajusta a lo que hay
  for (const l of e.lots) cart[l.id] = Math.min(cart[l.id] || 0, l.ticketsAvailable, MAX_PER_PURCHASE);
  document.title = e.title;
  const when = fmtWhen(e.date);
  const lotCard = l => {
    const max = Math.min(l.ticketsAvailable, MAX_PER_PURCHASE);
    return `
      <div class="ev-lot ${max < 1 ? 'sold' : ''} ${cart[l.id] > 0 ? 'on' : ''}">
        <span class="ev-lot-info">
          <span class="ev-lot-name">${esc(l.name)}</span>
          <span class="ev-lot-price">${max < 1 ? '<span class="ev-soldtag">Agotada</span>' : money(l.price)}</span>
        </span>
        ${max < 1 ? '' : `<span class="ev-lot-qty"><span>Cantidad</span>
          <select data-lot="${l.id}" aria-label="Cantidad de ${esc(l.name)}" onchange="setQty('${l.id}', this)">
            ${Array.from({ length: max + 1 }, (_, i) => `<option ${i === cart[l.id] ? 'selected' : ''}>${i}</option>`).join('')}
          </select></span>`}
      </div>`;
  };
  const anyFree = e.lots.some(l => l.ticketsAvailable > 0);
  $('view').innerHTML = `
  <div class="ev-hero ${e.imageUrl ? '' : 'no-cover'}">${e.imageUrl ? `<img src="${esc(e.imageUrl)}" alt="Portada de ${esc(e.title)}">` : datePoster(e.date)}</div>
  <div class="ev-layout">
    <section>
      <h2 class="ev-title">${esc(e.title)}</h2>
      <div class="ev-meta">
        <span class="ev-chip">📅 ${esc(when)}</span>
        <span class="ev-chip">📍 ${esc(e.location)}</span>
      </div>
      <p class="ev-desc">${esc(e.description)}</p>
      ${mapBlock(e)}
    </section>
    <form class="ev-panel" onsubmit="goCheckout(event)">
      <h2>Entradas</h2>
      <div class="ev-lots">${e.lots.map(lotCard).join('')}</div>
      <p class="ev-note">${anyFree ? `Podés combinar tipos de entrada. Hasta ${MAX_PER_PURCHASE} por compra.` : 'Las entradas de este evento están agotadas.'}</p>
      <div class="ev-pay">
        <div class="ev-total"><small>Total</small><b id="bTotal"></b></div>
        <button class="ev-btn" id="bPay" disabled>Comprar</button>
      </div>
    </form>
  </div>`;
  updTotal();
}

// Cambiar la cantidad de un tipo de entrada, respetando el máximo por compra
function setQty(lotId, select) {
  const before = cart[lotId] || 0;
  cart[lotId] = Number(select.value);
  if (cartCount() > MAX_PER_PURCHASE) {
    cart[lotId] = before;
    select.value = String(before);
    flash(`Podés comprar hasta ${MAX_PER_PURCHASE} entradas por compra`, 'err');
  } else flash('');
  updTotal();
}
function updTotal() {
  document.querySelectorAll('.ev-lot').forEach(card => {
    const sel = card.querySelector('select');
    card.classList.toggle('on', !!sel && Number(sel.value) > 0);
  });
  const n = cartCount();
  $('bTotal').textContent = n ? money(cartTotal()) : '';
  $('bPay').disabled = !n;
  $('bPay').textContent = n ? `Comprar ${n} entrada${n > 1 ? 's' : ''}` : 'Comprar';
}

// ---------- Paso 2: resumen, datos del comprador y reloj ----------
function goCheckout(ev) {
  ev.preventDefault();
  if (!cartCount()) return;
  history.pushState({ step: 'resumen' }, '', '#/resumen');
  viewCheckout();
}

function viewCheckout() {
  const e = currentEvent;
  if (!e || !cartCount()) return viewBuy(eventSlug);
  clearInterval(checkoutTimer);
  flash('');
  window.scrollTo(0, 0);
  const rows = cartLines().map(({ lot, quantity }) => `
    <div class="ev-row">
      <div class="ev-row-info">
        <span class="ev-lot-name">${esc(lot.name)}</span>
        <span class="ev-lot-price">${quantity} × ${money(lot.price)}</span>
      </div>
      <b class="ev-row-sub">${money(lot.price * quantity)}</b>
      <button type="button" class="ev-x" aria-label="Quitar ${esc(lot.name)}" onclick="removeLine('${lot.id}')">✕</button>
    </div>`).join('');
  $('view').innerHTML = `
  <div class="ev-step">
    <button type="button" class="ghost ev-back" onclick="backToTickets()">← Cambiar entradas</button>
    <h2 class="ev-title ev-step-title">Resumen de tu compra</h2>
    <p class="ev-desc">${esc(e.title)} · ${esc(fmtWhen(e.date))}</p>
  </div>
  <div class="ev-layout">
    <section>
      <div class="ev-summary">${rows}
        <div class="ev-row ev-row-total"><span>Total</span><b>${money(cartTotal())}</b></div>
      </div>
      <div class="ev-clock" id="clock" role="timer"></div>
    </section>
    <form class="ev-panel" onsubmit="submitBuy(event)">
      <h2>Tus datos</h2>
      <label for="bName">Nombre y apellido</label><input id="bName" required autocomplete="name" maxlength="100">
      <label for="bEmail">Email</label><input id="bEmail" type="email" required autocomplete="email">
      <label for="bEmail2">Repetir email</label><input id="bEmail2" type="email" required autocomplete="off">
      <p class="ev-note">Verificá que tu email sea correcto: ahí recibís las entradas. Al continuar te llevamos a la pasarela de pago. En modo de prueba el pago se aprueba automáticamente.</p>
      <div class="ev-pay">
        <div class="ev-total"><small>Total</small><b>${money(cartTotal())}</b></div>
        <button class="ev-btn" id="bFinish">Finalizar compra</button>
      </div>
    </form>
  </div>`;
  startCheckoutClock(Date.now() + CHECKOUT_MINUTES * 60 * 1000);
}

// Reloj del resumen: al llegar a cero se vuelve a elegir entradas
function startCheckoutClock(deadline) {
  const tick = () => {
    const el = $('clock');
    if (!el) return clearInterval(checkoutTimer);
    const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
    el.innerHTML = `<span class="ev-clock-time">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span>
      <span>Tenés ${CHECKOUT_MINUTES} minutos para finalizar la compra.</span>`;
    if (left <= 0) {
      clearInterval(checkoutTimer);
      history.replaceState(null, '', location.pathname);
      viewBuy(eventSlug).then(() => flash('Se terminó el tiempo. Elegí tus entradas de nuevo.', 'err'));
    }
  };
  tick();
  checkoutTimer = setInterval(tick, 1000);
}

function removeLine(lotId) {
  cart[lotId] = 0;
  if (cartCount()) viewCheckout();
  else backToTickets();
}
function backToTickets() {
  clearInterval(checkoutTimer);
  if (location.hash === '#/resumen') history.back();
  else viewBuy(eventSlug);
}
// El botón "atrás" del navegador vuelve a la selección de entradas
window.addEventListener('popstate', () => {
  if (location.hash === '#/resumen') return cartCount() ? viewCheckout() : viewBuy(eventSlug);
  if (/^#\/entradas\//.test(location.hash)) return;
  if ($('clock')) viewBuy(eventSlug);
});

async function submitBuy(ev) {
  ev.preventDefault();
  try {
    if ($('bEmail').value.trim().toLowerCase() !== $('bEmail2').value.trim().toLowerCase()) {
      $('bEmail2').focus();
      throw new Error('Los emails no coinciden');
    }
    const items = cartLines().map(({ lot, quantity }) => ({ lotId: lot.id, quantity }));
    if (!items.length) throw new Error('Elegí al menos una entrada');
    $('bFinish').disabled = true;
    const { purchase, checkoutUrl } = await api('/purchases/checkout', { method: 'POST', body: {
      eventId: currentEvent.id, items, buyerName: $('bName').value.trim(), buyerEmail: $('bEmail').value.trim(),
    }});
    clearInterval(checkoutTimer);
    // Pasarela real: se redirige a pagar y vuelve al link de las entradas
    if (checkoutUrl) { location.href = checkoutUrl; return; }
    // Sin checkoutUrl (modo de prueba): se simula la pasarela confirmando el cobro
    await api('/purchases/webhook', { method: 'POST', body: { paymentGatewayId: purchase.paymentGatewayId, status: 'approved' } });
    cart = {};
    go('tickets', purchase.accessToken);
    flash('¡Compra realizada! Estas son tus entradas.');
  } catch (err) {
    if ($('bFinish')) $('bFinish').disabled = false;
    flash(err.message, 'err');
  }
}

// "2× General, 3× VIP" (las compras viejas solo traen el nombre del lote)
const purchaseItems = p => p.items && p.items.length
  ? ' · ' + p.items.map(i => `${i.quantity}× ${esc(i.lotName)}`).join(', ')
  : (p.lotName ? ' ' + esc(p.lotName) : '');

// ---------- Mis entradas (link privado de la compra) ----------
async function viewTickets(token, tries = 0) {
  history.replaceState(null, '', '#/entradas/' + token);
  if (!tries) $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    const { purchase, event, tickets } = await api('/purchases/tickets/' + encodeURIComponent(token));
    const statusText = { valid: 'Válida', used: 'Ya ingresó', void: 'Anulada' };
    $('view').innerHTML = `
    <div style="max-width:420px;margin:auto">
      <div class="card">
        <h2>${esc(event.title)}</h2>
        <p class="muted">📅 ${esc(fmtWhen(event.date))}<br>📍 ${esc(event.location)}</p>
        <p class="muted">${esc(purchase.buyerName)} · ${purchase.quantity} entrada(s)${purchaseItems(purchase)} · ${money(purchase.totalPrice)}</p>
        ${tickets.length ? '<p class="muted">Cada QR es para una persona. También te llegan por email.</p>'
          : purchase.status === 'failed' ? '<p class="msg err">El pago no se completó. Volvé al evento para intentarlo de nuevo.</p>'
          : `<p class="muted">Estamos confirmando tu pago… esta página se actualiza sola.</p>
             ${purchase.expiresAt ? `<p class="msg hold" id="hold" data-exp="${esc(purchase.expiresAt)}"></p>` : ''}`}
      </div>
      ${tickets.map((t, i) => `
      <div class="card ticket" style="margin-top:14px">
        <div class="muted">Entrada ${i + 1} de ${tickets.length}${t.lotName ? ` · ${esc(t.lotName)}` : ''} · ${statusText[t.status]}</div>
        <img class="qr" src="${t.qr}" alt="QR ${esc(t.code)}">
        <p class="tcode">${esc(t.code)}</p>
      </div>`).join('')}
      <p style="text-align:center"><button class="ghost" onclick="go('events')">${eventSlug ? 'Volver al evento' : 'Volver a eventos'}</button></p>
    </div>`;
    startHoldTimer();
    // Al volver de la pasarela el aviso del pago puede tardar unos segundos: se reintenta solo
    if (!tickets.length && purchase.status === 'pending' && tries < 20) {
      setTimeout(() => { if (location.hash === '#/entradas/' + token) viewTickets(token, tries + 1); }, 3000);
    }
  } catch (err) { $('view').innerHTML = ''; flash(err.message, 'err'); }
}

// Cuenta regresiva de la reserva: las entradas se guardan unos minutos mientras se paga
let holdTimer;
function startHoldTimer() {
  clearInterval(holdTimer);
  const el = $('hold');
  if (!el) return;
  const exp = new Date(el.dataset.exp).getTime();
  const tick = () => {
    const left = Math.max(0, Math.round((exp - Date.now()) / 1000));
    if (left > 0) {
      el.className = 'msg hold';
      el.textContent = `⏳ Tu reserva se mantiene ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} más. Completá el pago antes de que venza.`;
    } else {
      clearInterval(holdTimer);
      el.className = 'msg err';
      el.textContent = 'La reserva venció y las entradas se liberaron. Si ya pagaste, esperá unos segundos; si no, volvé al evento para intentarlo de nuevo.';
    }
  };
  tick();
  holdTimer = setInterval(tick, 1000);
}

// Al volver del pago, Mercado Pago agrega sus parámetros después del token
// (#/entradas/<token>?payment_id=...&status=approved...): se ignoran
const ticketsLink = location.hash.match(/^#\/entradas\/([\w-]+)(?:\?.*)?$/);
ticketsLink ? go('tickets', ticketsLink[1]) : go('events');
</script>
</body>
</html>
