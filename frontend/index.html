<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticketera</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c1e26; --muted:#6b7080; --accent:#5b4cf0; --border:#e4e6ee; --ok:#1a8a4a; --err:#c62f3b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151b; --card:#1d1f28; --text:#eceef5; --muted:#9a9fb2; --accent:#8b7fff; --border:#2c2f3b; --ok:#4cc982; --err:#ff6b76; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; background:var(--card); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.25rem; color:var(--accent); }
  nav { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  input, textarea { font:inherit; width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card h3 { margin:0 0 6px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .price { font-weight:700; color:var(--accent); margin:8px 0; }
  .msg { padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:.9rem; }
  .msg.ok { background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
  .msg.err { background:color-mix(in srgb,var(--err) 15%,transparent); color:var(--err); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .ticket { text-align:center; }
  .code { font-family:monospace; font-size:.7rem; word-break:break-all; color:var(--muted); }
  .qr { width:220px; max-width:100%; height:auto; background:#fff; border-radius:8px; }
  .tcode { font-family:monospace; font-size:1.5rem; letter-spacing:2px; font-weight:700; margin:8px 0 0; }
  .result { text-align:center; padding:24px 16px; border-radius:12px; margin-top:14px; color:#fff; }
  .result h2 { margin:0 0 6px; font-size:1.8rem; }
  .result.ok { background:var(--ok); }
  .result.err { background:var(--err); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }
  .stat { padding:12px 14px; }
  .statv { font-size:1.5rem; font-weight:700; margin-top:4px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input { flex:1 1 220px; width:auto; }
  .toolbar select { flex:0 0 auto; width:auto; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; }
  .tag { display:inline-block; font-family:monospace; font-size:.75rem; padding:2px 6px; border-radius:6px; margin-top:4px; background:var(--bg); border:1px solid var(--border); white-space:nowrap; }
  .tag.used, .tag.completed { color:var(--ok); border-color:var(--ok); }
  .tag.failed, .tag.void, .tag.refunded { color:var(--err); border-color:var(--err); }
  .tag.pending { color:var(--muted); }
  select { font:inherit; width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  h2 { margin-top:0; }
  .hidden { display:none; }
  .lots { margin:8px 0; }
  .lot { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--border); }
  .lot:last-child { border-bottom:0; }
  .lot.sold b, .lot.sold span { color:var(--muted); }
  .tag.soldout { color:var(--err); border-color:var(--err); font-family:inherit; margin:0; }
  .lotrow { align-items:flex-end; margin-bottom:8px; }
  .lotrow label { margin-top:0; }
  .lotrow > .grow { flex:2; }
  .lotrow > .fit { flex:0 0 auto; }
  button.danger { background:transparent; color:var(--err); border-color:var(--err); }
  .choice { display:flex; align-items:center; gap:10px; padding:10px 12px; margin:6px 0; border:1px solid var(--border); border-radius:10px; cursor:pointer; }
  .choice input { width:auto; margin:0; }
  .choice.sold { opacity:.55; cursor:default; }
  .choice .grow { flex:1; }
  .choice:has(input:checked) { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%,transparent); }
</style>
</head>
<body>
<header>
  <h1>🎟️ Ticketera</h1>
  <nav id="nav"></nav>
</header>
<main>
  <div id="msg"></div>
  <div id="view"></div>
</main>

<script>
// El backend sirve esta página, así que la API está en el mismo origen. Solo si se
// abre el archivo directamente (file://) se usa el backend local
const API = (localStorage.getItem('ticketera_api') ||
  (location.protocol === 'file:' ? 'http://localhost:5000' : location.origin)) + '/api';
const state = { token: localStorage.getItem('token'), user: JSON.parse(localStorage.getItem('user') || 'null') };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '$' + Number(n).toLocaleString('es-AR');

function flash(text, type = 'ok') {
  $('msg').innerHTML = text ? `<div class="msg ${type}">${esc(text)}</div>` : '';
  if (text) window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function api(path, { method = 'GET', body, auth = false } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && state.token) headers.Authorization = 'Bearer ' + state.token;
  let res;
  try { res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw new Error('No se pudo conectar con el backend (' + API + ')'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || 'Error ' + res.status);
  return data;
}

function setSession(token, user) {
  state.token = token; state.user = user;
  if (token) { localStorage.setItem('token', token); localStorage.setItem('user', JSON.stringify(user)); }
  else { localStorage.removeItem('token'); localStorage.removeItem('user'); }
  renderNav();
}

function renderNav() {
  $('nav').innerHTML = state.user
    ? `<span class="muted">Hola, ${esc(state.user.name)}</span>
       <button class="ghost" onclick="go('events')">Eventos</button>
       <button class="ghost" onclick="go('new')">Crear evento</button>
       <button class="ghost" onclick="go('validate')">Validar QR</button>
       <button onclick="logout()">Salir</button>`
    : `<button class="ghost" onclick="go('events')">Eventos</button>
       <button onclick="go('login')">Ingresar</button>`;
}

function logout() { setSession(null, null); go('events'); }

function go(view, arg) {
  flash('');
  // Solo la vista de entradas tiene URL propia (es el link que llega por email)
  if (view !== 'tickets' && location.hash) history.replaceState(null, '', location.pathname);
  ({ events: viewEvents, login: viewLogin, new: viewNew, buy: viewBuy, tickets: viewTickets, validate: viewValidate, buyers: viewBuyers, edit: viewEdit }[view])(arg);
}

// ---------- Eventos ----------
const isManager = (e) => state.user && (e.userId === state.user.id || state.user.role === 'admin');

async function viewEvents() {
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    // Borradores y cancelados solo los ve su organizador
    const events = (await api('/events')).events.filter(e => e.status === 'published' || isManager(e));
    $('view').innerHTML = `<h2>Próximos eventos</h2>` + (events.length
      ? `<div class="grid">${events.map(e => `
        <div class="card">
          <h3>${esc(e.title)} ${e.status !== 'published' ? `<span class="tag failed">${e.status === 'draft' ? 'Borrador' : 'Cancelado'}</span>` : ''}</h3>
          <div class="muted">📅 ${new Date(e.date).toLocaleString('es-AR')}<br>📍 ${esc(e.location)}</div>
          <p>${esc(e.description)}</p>
          <div class="lots">${e.lots.map(l => `
            <div class="lot ${l.ticketsAvailable < 1 ? 'sold' : ''}">
              <b>${esc(l.name)}</b>
              ${l.ticketsAvailable < 1 ? '<span class="tag soldout">Agotada</span>' : `<span class="price" style="margin:0">${money(l.price)}</span>`}
            </div>`).join('')}</div>
          <p><button ${e.ticketsAvailable < 1 || e.status !== 'published' ? 'disabled' : ''} onclick="go('buy','${e.id}')">${e.ticketsAvailable < 1 ? 'Agotado' : 'Comprar'}</button>
          ${isManager(e) ? `<button class="ghost" onclick="go('buyers','${e.id}')">Compradores</button>
          <button class="ghost" onclick="go('edit','${e.id}')">Editar</button>` : ''}</p>
        </div>`).join('')}</div>`
      : '<p class="muted">Todavía no hay eventos. Ingresá y creá el primero.</p>');
  } catch (err) { $('view').innerHTML = ''; flash(err.message, 'err'); }
}

// ---------- Compradores (organizador) ----------
const purchaseStatus = { completed: 'Pagada', pending: 'Pendiente', failed: 'Rechazada', refunded: 'Reembolsada' };
let buyers = { event: null, purchases: [] };

async function viewBuyers(eventId) {
  if (!state.user) return go('login');
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    const [{ event }, { purchases }] = await Promise.all([
      api('/events/' + eventId),
      api('/purchases/event/' + eventId, { auth: true }),
    ]);
    buyers = { event, purchases };
  } catch (err) { $('view').innerHTML = ''; return flash(err.message, 'err'); }

  const paid = buyers.purchases.filter(p => p.status === 'completed');
  const tickets = paid.flatMap(p => p.Tickets);
  const stat = (label, value) => `<div class="card stat"><div class="muted">${label}</div><div class="statv">${value}</div></div>`;

  $('view').innerHTML = `
  <h2>${esc(buyers.event.title)}</h2>
  <p class="muted">📅 ${new Date(buyers.event.date).toLocaleString('es-AR')} · 📍 ${esc(buyers.event.location)}</p>
  <div class="stats">
    ${stat('Entradas vendidas', tickets.length)}
    ${stat('Recaudado', money(paid.reduce((s, p) => s + Number(p.totalPrice), 0)))}
    ${stat('Ingresaron', `${tickets.filter(t => t.status === 'used').length} / ${tickets.length}`)}
    ${stat('Disponibles', buyers.event.ticketsAvailable)}
  </div>
  <div class="card">
    <div class="toolbar">
      <input id="bSearch" placeholder="Buscar por nombre, email o código" oninput="renderBuyers()">
      <select id="bFilter" onchange="renderBuyers()">
        <option value="completed">Pagadas</option>
        <option value="all">Todas</option>
        <option value="pending">Pendientes</option>
        <option value="failed">Rechazadas</option>
      </select>
      <button class="ghost" onclick="exportBuyersCsv()">Exportar CSV</button>
    </div>
    <div id="bList"></div>
  </div>
  <p><button class="ghost" onclick="go('events')">Volver a eventos</button></p>`;
  renderBuyers();
}

function renderBuyers() {
  const q = $('bSearch').value.trim().toLowerCase();
  const filter = $('bFilter').value;
  const list = buyers.purchases.filter(p =>
    (filter === 'all' || p.status === filter) &&
    (!q || [p.buyerName, p.buyerEmail, p.lotName || '', ...p.Tickets.map(t => t.code)].some(v => v.toLowerCase().includes(q)))
  );
  const time = (d) => new Date(d).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

  $('bList').innerHTML = list.length ? `
  <div class="table-wrap"><table>
    <thead><tr><th>Comprador</th><th>Entradas</th><th>Total</th><th>Estado</th><th>Fecha</th><th></th></tr></thead>
    <tbody>${list.map(p => `
      <tr>
        <td><b>${esc(p.buyerName)}</b><br><span class="muted">${esc(p.buyerEmail)}</span></td>
        <td>${p.quantity}${p.lotName ? ` · <b>${esc(p.lotName)}</b>` : ''}${p.Tickets.length ? `<br>${p.Tickets.map(t => `<span class="tag ${t.status}" title="${t.status === 'used' ? 'Ingresó a las ' + time(t.usedAt) : ''}">${esc(t.code)}${t.status === 'used' ? ' ✓' : ''}</span>`).join(' ')}` : ''}</td>
        <td>${money(p.totalPrice)}</td>
        <td><span class="tag ${p.status}">${purchaseStatus[p.status]}</span></td>
        <td class="muted">${new Date(p.createdAt).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })}</td>
        <td>${p.status === 'completed' ? `<a href="#/entradas/${esc(p.accessToken)}" target="_blank">Ver entradas</a>` : ''}</td>
      </tr>`).join('')}
    </tbody>
  </table></div>
  <p class="muted">${list.length} compra(s)</p>`
  : '<p class="muted">No hay compras que coincidan.</p>';
}

// Una fila por entrada: sirve de lista de respaldo en papel para la puerta
function exportBuyersCsv() {
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Codigo', 'Lote', 'Estado entrada', 'Ingreso', 'Comprador', 'Email', 'Estado compra', 'Fecha compra']];
  for (const p of buyers.purchases) {
    for (const t of p.Tickets) {
      rows.push([t.code, p.lotName || '', t.status === 'used' ? 'Ingresó' : t.status === 'void' ? 'Anulada' : 'Válida',
        t.usedAt ? new Date(t.usedAt).toLocaleString('es-AR') : '', p.buyerName, p.buyerEmail,
        purchaseStatus[p.status], new Date(p.createdAt).toLocaleString('es-AR')]);
    }
  }
  const csv = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n'); // BOM + ; para que Excel lo abra bien
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `compradores-${buyers.event.title.replace(/[^\w-]+/g, '_')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- Login / registro ----------
function viewLogin() {
  $('view').innerHTML = `
  <div class="card" style="max-width:380px;margin:auto">
    <h2 id="authTitle">Ingresar</h2>
    <form onsubmit="submitAuth(event)">
      <div id="nameBox" class="hidden"><label>Nombre</label><input id="aName"></div>
      <label>Email</label><input id="aEmail" type="email" required>
      <label>Contraseña</label><input id="aPass" type="password" required minlength="6">
      <p><button id="authBtn">Ingresar</button></p>
    </form>
    <p class="muted"><a href="#" onclick="toggleAuth();return false" id="toggleLink">¿No tenés cuenta? Registrate</a></p>
  </div>`;
}
let registering = false;
function toggleAuth() {
  registering = !registering;
  $('nameBox').classList.toggle('hidden', !registering);
  $('authTitle').textContent = $('authBtn').textContent = registering ? 'Registrarme' : 'Ingresar';
  $('toggleLink').textContent = registering ? 'Ya tengo cuenta' : '¿No tenés cuenta? Registrate';
}
async function submitAuth(ev) {
  ev.preventDefault();
  try {
    const body = { email: $('aEmail').value, password: $('aPass').value };
    if (registering) body.name = $('aName').value;
    const { token, user } = await api(registering ? '/auth/register' : '/auth/login', { method: 'POST', body });
    setSession(token, user);
    go('events');
    flash('Sesión iniciada');
  } catch (err) { flash(err.message, 'err'); }
}

// ---------- Crear evento ----------
function viewNew() {
  if (!state.user) return go('login');
  $('view').innerHTML = `
  <div class="card" style="max-width:520px;margin:auto">
    <h2>Crear evento</h2>
    <form onsubmit="submitEvent(event)">
      <label>Título</label><input id="eTitle" required>
      <label>Descripción</label><textarea id="eDesc" rows="3" required></textarea>
      <div class="row">
        <div><label>Fecha y hora</label><input id="eDate" type="datetime-local" required></div>
        <div><label>Lugar</label><input id="eLoc" required></div>
      </div>
      <h3 style="margin-bottom:0">Tipos de entrada</h3>
      <p class="muted" style="margin-top:4px">Cada lote tiene su precio y su cantidad. Después los podés editar o agotar.</p>
      <datalist id="lotNames"><option value="EARLY"><option value="VIP"><option value="General"><option value="Jugador"></datalist>
      <div id="lotRows"></div>
      <p><button type="button" class="ghost" onclick="addLotRow()">+ Agregar lote</button></p>
      <p><button>Publicar</button></p>
    </form>
  </div>`;
  addLotRow('General');
}
// Fila para cargar un lote (nombre, precio, cantidad)
function addLotRow(name = '') {
  const row = document.createElement('div');
  row.className = 'row lotrow';
  row.innerHTML = `
    <div class="grow"><label>Lote</label><input class="lName" list="lotNames" value="${esc(name)}" placeholder="EARLY, VIP…" required maxlength="60"></div>
    <div><label>Precio</label><input class="lPrice" type="number" min="0" step="0.01" required></div>
    <div><label>Cantidad</label><input class="lQty" type="number" min="1" step="1" required></div>
    <div class="fit"><button type="button" class="danger" title="Quitar" onclick="removeLotRow(this)">✕</button></div>`;
  $('lotRows').appendChild(row);
}
function removeLotRow(btn) {
  if (document.querySelectorAll('#lotRows .lotrow').length < 2) return flash('El evento necesita al menos un lote', 'err');
  btn.closest('.lotrow').remove();
}
async function submitEvent(ev) {
  ev.preventDefault();
  try {
    const lots = [...document.querySelectorAll('#lotRows .lotrow')].map(r => ({
      name: r.querySelector('.lName').value.trim(),
      price: Number(r.querySelector('.lPrice').value),
      quantity: Number(r.querySelector('.lQty').value),
    }));
    await api('/events', { method: 'POST', auth: true, body: {
      title: $('eTitle').value, description: $('eDesc').value,
      date: new Date($('eDate').value).toISOString(), location: $('eLoc').value, lots,
    }});
    go('events');
    flash('Evento creado');
  } catch (err) { flash(err.message, 'err'); }
}

// ---------- Editar evento y lotes (organizador) ----------
const toLocalInput = (d) => { const t = new Date(d); return new Date(t - t.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };

async function viewEdit(id) {
  if (!state.user) return go('login');
  let event;
  try { ({ event } = await api('/events/' + id)); } catch (err) { return flash(err.message, 'err'); }
  if (!isManager(event)) return flash('No tenés permiso para editar este evento', 'err');

  $('view').innerHTML = `
  <div class="card" style="max-width:720px;margin:auto">
    <h2>Editar evento</h2>
    <form onsubmit="saveEvent(event,'${event.id}')">
      <label>Título</label><input id="eTitle" value="${esc(event.title)}" required>
      <label>Descripción</label><textarea id="eDesc" rows="3" required>${esc(event.description)}</textarea>
      <div class="row">
        <div><label>Fecha y hora</label><input id="eDate" type="datetime-local" value="${toLocalInput(event.date)}" required></div>
        <div><label>Lugar</label><input id="eLoc" value="${esc(event.location)}" required></div>
      </div>
      <label>Estado</label>
      <select id="eStatus">
        <option value="published" ${event.status === 'published' ? 'selected' : ''}>Publicado (a la venta)</option>
        <option value="draft" ${event.status === 'draft' ? 'selected' : ''}>Borrador (oculto, sin ventas)</option>
        <option value="cancelled" ${event.status === 'cancelled' ? 'selected' : ''}>Cancelado</option>
      </select>
      <p><button>Guardar datos del evento</button></p>
    </form>

    <h3>Tipos de entrada</h3>
    <p class="muted">Cambiar el precio o el nombre solo afecta las compras nuevas. “Vendidas” incluye las reservadas por compras que todavía no se pagaron.</p>
    ${event.lots.map(l => {
      const sold = l.quantity - l.ticketsAvailable;
      return `
      <div class="card" style="margin-bottom:10px">
        <div class="row lotrow">
          <div class="grow"><label>Lote</label><input id="lName_${l.id}" value="${esc(l.name)}" maxlength="60"></div>
          <div><label>Precio</label><input id="lPrice_${l.id}" type="number" min="0" step="0.01" value="${Number(l.price)}"></div>
          <div><label>Cantidad asignada</label><input id="lQty_${l.id}" type="number" min="${sold}" step="1" value="${l.quantity}"></div>
        </div>
        <p class="muted" style="margin:6px 0">Vendidas: <b>${sold}</b> · Disponibles: <b>${l.ticketsAvailable}</b>
          ${l.ticketsAvailable < 1 ? '<span class="tag soldout">Agotada</span>' : ''}</p>
        <button type="button" onclick="saveLot('${event.id}','${l.id}')">Guardar lote</button>
        <button type="button" class="ghost" ${l.ticketsAvailable < 1 ? 'disabled' : ''} onclick="soldOutLot('${event.id}','${l.id}')">Agotar</button>
        <button type="button" class="danger" ${sold > 0 || event.lots.length < 2 ? 'disabled' : ''}
          title="${sold > 0 ? 'Ya tiene ventas: podés agotarlo' : event.lots.length < 2 ? 'El evento necesita al menos un lote' : ''}"
          onclick="deleteLotBtn('${event.id}','${l.id}')">Borrar</button>
      </div>`;
    }).join('')}

    <div class="card">
      <h4 style="margin:0">Agregar un lote</h4>
      <datalist id="lotNames"><option value="EARLY"><option value="VIP"><option value="General"><option value="Jugador"></datalist>
      <div class="row lotrow">
        <div class="grow"><label>Lote</label><input id="nName" list="lotNames" maxlength="60" placeholder="EARLY, VIP…"></div>
        <div><label>Precio</label><input id="nPrice" type="number" min="0" step="0.01"></div>
        <div><label>Cantidad</label><input id="nQty" type="number" min="1" step="1"></div>
      </div>
      <button type="button" onclick="addLotBtn('${event.id}')">Agregar lote</button>
    </div>
    <p><button class="ghost" onclick="go('events')">Volver a eventos</button></p>
  </div>`;
}

async function saveEvent(ev, id) {
  ev.preventDefault();
  try {
    await api('/events/' + id, { method: 'PUT', auth: true, body: {
      title: $('eTitle').value, description: $('eDesc').value, location: $('eLoc').value,
      date: new Date($('eDate').value).toISOString(), status: $('eStatus').value,
    }});
    await viewEdit(id);
    flash('Evento actualizado');
  } catch (err) { flash(err.message, 'err'); }
}
async function saveLot(eventId, lotId) {
  try {
    await api(`/events/${eventId}/lots/${lotId}`, { method: 'PUT', auth: true, body: {
      name: $('lName_' + lotId).value, price: Number($('lPrice_' + lotId).value), quantity: Number($('lQty_' + lotId).value),
    }});
    await viewEdit(eventId);
    flash('Lote actualizado');
  } catch (err) { flash(err.message, 'err'); }
}
async function soldOutLot(eventId, lotId) {
  if (!confirm('¿Agotar este lote? Nadie podrá comprarlo hasta que vuelvas a subir la cantidad.')) return;
  try {
    await api(`/events/${eventId}/lots/${lotId}`, { method: 'PUT', auth: true, body: { soldOut: true } });
    await viewEdit(eventId);
    flash('Lote agotado');
  } catch (err) { flash(err.message, 'err'); }
}
async function deleteLotBtn(eventId, lotId) {
  if (!confirm('¿Borrar este lote?')) return;
  try {
    await api(`/events/${eventId}/lots/${lotId}`, { method: 'DELETE', auth: true });
    await viewEdit(eventId);
    flash('Lote eliminado');
  } catch (err) { flash(err.message, 'err'); }
}
async function addLotBtn(eventId) {
  try {
    if ($('nPrice').value === '') throw new Error('Completá el precio del lote');
    await api(`/events/${eventId}/lots`, { method: 'POST', auth: true, body: {
      name: $('nName').value, price: Number($('nPrice').value), quantity: Number($('nQty').value),
    }});
    await viewEdit(eventId);
    flash('Lote agregado');
  } catch (err) { flash(err.message, 'err'); }
}

// ---------- Compra ----------
let currentEvent = null;
async function viewBuy(id) {
  try {
    ({ event: currentEvent } = await api('/events/' + id));
  } catch (err) { return flash(err.message, 'err'); }
  const e = currentEvent;
  if (e.status !== 'published') return flash('Este evento no está a la venta', 'err');
  const firstFree = e.lots.find(l => l.ticketsAvailable > 0);
  $('view').innerHTML = `
  <div class="card" style="max-width:480px;margin:auto">
    <h2>${esc(e.title)}</h2>
    <p class="muted">📅 ${new Date(e.date).toLocaleString('es-AR')} · 📍 ${esc(e.location)}</p>
    <form onsubmit="submitBuy(event)">
      <label>Tipo de entrada</label>
      ${e.lots.map(l => `
        <label class="choice ${l.ticketsAvailable < 1 ? 'sold' : ''}" style="color:var(--text);font-size:1rem">
          <input type="radio" name="bLot" value="${l.id}" ${l === firstFree ? 'checked' : ''} ${l.ticketsAvailable < 1 ? 'disabled' : ''} onchange="updTotal()">
          <span class="grow"><b>${esc(l.name)}</b></span>
          ${l.ticketsAvailable < 1 ? '<span class="tag soldout">Agotada</span>' : `<span class="price" style="margin:0">${money(l.price)}</span>`}
        </label>`).join('')}
      <label>Nombre</label><input id="bName" value="${esc(state.user?.name)}" required>
      <label>Email</label><input id="bEmail" type="email" value="${esc(state.user?.email)}" required>
      <label id="bQtyLabel">Cantidad</label>
      <input id="bQty" type="number" min="1" value="1" required oninput="updTotal()">
      <p class="price" id="bTotal"></p>
      <p><button ${firstFree ? '' : 'disabled'}>Pagar</button> <button type="button" class="ghost" onclick="go('events')">Volver</button></p>
      <p class="muted">Al continuar te llevamos a la pasarela de pago. En modo de prueba el pago se aprueba automáticamente.</p>
    </form>
  </div>`;
  updTotal();
}
const selectedLot = () => {
  const r = document.querySelector('input[name="bLot"]:checked');
  return r && currentEvent.lots.find(l => l.id === r.value);
};
// Actualiza el máximo y el total según el lote elegido
function updTotal() {
  const lot = selectedLot();
  $('bQty').max = lot ? lot.ticketsAvailable : 0;
  $('bQtyLabel').textContent = lot ? `Cantidad (máx. ${lot.ticketsAvailable})` : 'Cantidad';
  $('bTotal').textContent = lot ? money(lot.price * (Number($('bQty').value) || 0)) : '';
}

async function submitBuy(ev) {
  ev.preventDefault();
  try {
    const lot = selectedLot();
    if (!lot) throw new Error('Elegí un tipo de entrada');
    const { purchase, checkoutUrl } = await api('/purchases/checkout', { method: 'POST', body: {
      eventId: currentEvent.id, lotId: lot.id, buyerName: $('bName').value,
      buyerEmail: $('bEmail').value, quantity: Number($('bQty').value),
    }});
    // Pasarela real: se redirige a pagar y vuelve al link de las entradas
    if (checkoutUrl) { location.href = checkoutUrl; return; }
    // Sin checkoutUrl (modo de prueba): se simula la pasarela confirmando el cobro
    await api('/purchases/webhook', { method: 'POST', body: { paymentGatewayId: purchase.paymentGatewayId, status: 'approved' } });
    go('tickets', purchase.accessToken);
    flash('¡Compra realizada! Estas son tus entradas.');
  } catch (err) { flash(err.message, 'err'); }
}

// ---------- Mis entradas (link privado de la compra) ----------
async function viewTickets(token) {
  history.replaceState(null, '', '#/entradas/' + token);
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    const { purchase, event, tickets } = await api('/purchases/tickets/' + encodeURIComponent(token));
    const statusText = { valid: 'Válida', used: 'Ya ingresó', void: 'Anulada' };
    $('view').innerHTML = `
    <div style="max-width:420px;margin:auto">
      <div class="card">
        <h2>${esc(event.title)}</h2>
        <p class="muted">📅 ${new Date(event.date).toLocaleString('es-AR')}<br>📍 ${esc(event.location)}</p>
        <p class="muted">${esc(purchase.buyerName)} · ${purchase.quantity} entrada(s)${purchase.lotName ? ` ${esc(purchase.lotName)}` : ''} · ${money(purchase.totalPrice)}</p>
        ${tickets.length ? '<p class="muted">Cada QR es para una persona. También te llegan por email.</p>' : '<p class="muted">El pago todavía no se confirmó.</p>'}
      </div>
      ${tickets.map((t, i) => `
      <div class="card ticket" style="margin-top:14px">
        <div class="muted">Entrada ${i + 1} de ${tickets.length} · ${statusText[t.status]}</div>
        <img class="qr" src="${t.qr}" alt="QR ${esc(t.code)}">
        <p class="tcode">${esc(t.code)}</p>
      </div>`).join('')}
      <p style="text-align:center"><button class="ghost" onclick="go('events')">Volver a eventos</button></p>
    </div>`;
  } catch (err) { $('view').innerHTML = ''; flash(err.message, 'err'); }
}

// ---------- Validar entrada (staff / organizador) ----------
// Identifica este dispositivo en el registro de ingresos
const deviceId = localStorage.getItem('deviceId') || (() => {
  const id = 'web-' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('deviceId', id);
  return id;
})();
const uuid = () => crypto.randomUUID ? crypto.randomUUID()
  : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));

async function viewValidate() {
  if (!state.user) return go('login');
  let events = [];
  try { ({ events } = await api('/events?limit=100')); } catch (err) { return flash(err.message, 'err'); }
  const lastEvent = localStorage.getItem('validateEvent');
  $('view').innerHTML = `
  <div class="card" style="max-width:480px;margin:auto">
    <h2>Validar entrada</h2>
    <form onsubmit="submitValidate(event)">
      <label>Evento</label>
      <select id="vEvent" required onchange="localStorage.setItem('validateEvent', this.value)">
        ${events.map(e => `<option value="${e.id}" ${e.id === lastEvent ? 'selected' : ''}>${esc(e.title)} · ${new Date(e.date).toLocaleDateString('es-AR')}</option>`).join('')}
      </select>
      <label>Código de la entrada</label>
      <input id="vCode" required autocomplete="off" autocapitalize="characters" placeholder="XXXXX-XXXXX" style="font-family:monospace;font-size:1.2rem">
      <p><button>Validar</button></p>
    </form>
    <div id="vResult"></div>
  </div>`;
  $('vCode').focus();
}
async function submitValidate(ev) {
  ev.preventDefault();
  const code = $('vCode').value.trim();
  try {
    const { results } = await api(`/checkin/events/${$('vEvent').value}/sync`, { method: 'POST', auth: true, body: {
      deviceId, since: new Date().toISOString(), scans: [{ id: uuid(), code, scannedAt: new Date().toISOString() }],
    }});
    const { result, ticket } = results[0];
    const time = (d) => new Date(d).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    const view = {
      admitted: ['ok', '✅ PUEDE PASAR', ticket?.code],
      duplicate: ['err', '⛔ YA INGRESÓ', ticket && `${ticket.code} · ingresó a las ${time(ticket.usedAt)}`],
      invalid: ['err', '❌ CÓDIGO INVÁLIDO', 'No existe una entrada con ese código para este evento'],
      void: ['err', '❌ ENTRADA ANULADA', ticket?.code],
    }[result];
    $('vResult').innerHTML = `<div class="result ${view[0]}"><h2>${view[1]}</h2><div>${esc(view[2])}</div></div>`;
    $('vCode').value = '';
    $('vCode').focus();
  } catch (err) { flash(err.message, 'err'); }
}

renderNav();
const ticketsLink = location.hash.match(/^#\/entradas\/([\w-]+)$/);
ticketsLink ? go('tickets', ticketsLink[1]) : go('events');
</script>
</body>
