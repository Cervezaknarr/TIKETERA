# Blueprint de Render: un servicio web (API + frontend) y una base Postgres.
# En Render: New > Blueprint > elegir este repositorio.
services:
  - type: web
    name: ticketera
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ticketera-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Dirección pública del servicio (https://ticketera-XXXX.onrender.com).
      # Se completa a mano después del primer deploy, cuando Render la asigna
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

databases:
  - name: ticketera-db
    plan: free
