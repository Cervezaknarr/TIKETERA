<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kaiser Tikets · Admin</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <h1>🎟️ Kaiser Tikets <span class="muted">· Admin</span></h1>
  <nav id="nav"></nav>
</header>
<main>
  <div id="msg"></div>
  <div id="view"></div>
</main>

<script src="/common.js"></script>
<script>
// Panel de administración: eventos, compradores y usuarios staff
const auth = createSession('admin');
onUnauthorized = () => { logout(); flash('La sesión venció. Volvé a ingresar.', 'err'); };

function renderNav() {
  $('nav').innerHTML = session.user
    ? `<span class="muted">${esc(session.user.name)}</span>
       <button class="ghost" onclick="go('events')">Eventos</button>
       <button class="ghost" onclick="go('edit')">Crear evento</button>
       <button class="ghost" onclick="go('payments')">Pagos</button>
       <button class="ghost" onclick="go('users')">Staff y organizadores</button>
       <a href="/staff/" class="ghost-link">Escáner</a>
       <button onclick="logout()">Salir</button>`
    : '';
}

function logout() { auth.set(null, null); renderNav(); go('events'); }

function go(view, arg) {
  flash('');
  renderNav();
  if (!session.token) {
    return renderLogin('Administración', ['admin'], (token, user) => { auth.set(token, user); go('events'); });
  }
  ({ events: viewEvents, edit: viewEdit, buyers: viewBuyers, users: viewUsers, payments: viewPayments }[view])(arg);
}

const eventStatus = { published: 'Publicado', draft: 'Borrador', cancelled: 'Cancelado' };

// ---------- Eventos ----------
async function viewEvents() {
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    const { events } = await api('/events?limit=100', { auth: true });
    // Ingresos de cada evento (en paralelo; si falla uno se muestra sin el dato)
    const stats = await Promise.all(events.map(e =>
      api(`/checkin/events/${e.id}/stats`, { auth: true }).then(r => r.stats).catch(() => null)));
    $('view').innerHTML = `<h2>Eventos</h2>` + (events.length
      ? `<div class="grid">${events.map((e, i) => `
        <div class="card">
          <h3>${esc(e.title)} <span class="tag ${e.status === 'published' ? 'completed' : 'failed'}">${eventStatus[e.status]}</span>${ageOf(e) ? ` <span class="tag">+${ageOf(e)}</span>` : ''}</h3>
          <div class="muted">📅 ${new Date(e.date).toLocaleString('es-AR')}<br>📍 ${esc(e.location)}<br>🔗 <a href="/e/${esc(e.slug)}" target="_blank">${location.origin}/e/${esc(e.slug)}</a></div>
          <div class="lots">${e.lots.map(l => `
            <div class="lot ${l.ticketsAvailable < 1 ? 'sold' : ''}">
              <b>${esc(l.name)}</b>
              <span class="muted">${l.quantity - l.ticketsAvailable}/${l.quantity} · ${money(l.price)}
                ${l.ticketsAvailable < 1 ? '<span class="tag soldout">Agotada</span>' : ''}</span>
            </div>`).join('')}</div>
          <div class="muted">${e.ticketsAvailable} disponibles${stats[i] ? ` · ${stats[i].total} vendidas · ${stats[i].admitted} ingresaron` : ''}</div>
          <p><button onclick="go('buyers','${e.id}')">Compradores</button>
             <button class="ghost" onclick="go('edit','${e.id}')">Editar</button></p>
        </div>`).join('')}</div>`
      : `<p class="muted">Todavía no hay eventos.</p><p><button onclick="go('edit')">Crear el primero</button></p>`);
  } catch (err) { $('view').innerHTML = ''; flash(err.message, 'err'); }
}

// ---------- Crear / editar evento y sus lotes ----------
// datetime-local trabaja con la hora local sin zona: "2026-11-07T23:00"
const toLocalInput = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };

const lotNamesList = '<datalist id="lotNames"><option value="EARLY"><option value="VIP"><option value="General"><option value="Jugador"></datalist>';

async function viewEdit(id) {
  let e = { title: '', description: '', location: '', status: 'published', lots: [] };
  if (id) {
    try { ({ event: e } = await api('/events/' + id, { auth: true })); } catch (err) { return flash(err.message, 'err'); }
  }

  // Organizadores disponibles (usuarios con rol organizador), para asignarlo al evento
  let organizers = [];
  try { ({ users: organizers } = await api('/users', { auth: true })); organizers = organizers.filter(u => u.role === 'organizer'); } catch { /* sin lista: el selector queda vacío */ }

  coverData = undefined; // sin tocar: el evento conserva su portada
  const eventFields = `
      <label>Portada</label>
      <div class="dropzone ${e.imageUrl ? 'has-img' : ''}" id="dropzone"
        onclick="$('coverFile').click()" ondragover="coverDrag(event, true)" ondragleave="coverDrag(event, false)" ondrop="coverDrop(event)">
        <img id="coverPrev" alt="" ${e.imageUrl ? `src="${esc(e.imageUrl)}"` : ''}>
        <div class="dz-hint">🖼️ <b>Arrastrá la imagen acá</b><br><span class="muted">o hacé clic para elegirla · JPG, PNG o WebP</span></div>
        <button type="button" class="ghost danger dz-remove" onclick="event.stopPropagation(); removeCover()">Quitar</button>
        <input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="setCover(this.files[0])">
      </div>
      <label>Título</label><input id="eTitle" required value="${esc(e.title)}">
      <label>Descripción</label><textarea id="eDesc" rows="3" required>${esc(e.description)}</textarea>
      <div class="row">
        <div><label>Fecha y hora</label><input id="eDate" type="datetime-local" required value="${e.date ? toLocalInput(e.date) : ''}"></div>
        <div><label>Lugar</label><input id="eLoc" required value="${esc(e.location)}"></div>
      </div>
      <label>Edad mínima (opcional)</label>
      <input id="eMinAge" type="number" min="1" max="99" step="1" list="eAgeOpts" placeholder="Sin restricción" value="${ageOf(e) || ''}">
      <datalist id="eAgeOpts"><option value="16"><option value="18"><option value="21"><option value="23"></datalist>
      <p class="muted" style="margin:4px 0 12px">Muestra la etiqueta «+edad» en el evento. No cambia la compra. Vacío = sin etiqueta.</p>
      <label>Organizador (opcional)</label>
      <select id="eOrganizer">
        <option value="">Sin organizador (lo manejo yo)</option>
        ${organizers.map(u => `<option value="${u.id}" ${e.organizerId === u.id ? 'selected' : ''}>${esc(u.name)} · ${esc(u.email)}</option>`).join('')}
      </select>
      <p class="muted" style="margin:4px 0 12px">El organizador entra a <b>${esc(location.origin)}/organizador</b>: ve los compradores de este evento, crea su staff, escanea entradas y maneja sus cobros (cuenta de Mercado Pago y pausa de ventas). ${organizers.length ? '' : 'Todavía no hay organizadores: creá uno en <b>Staff</b>.'}</p>
      <label>Estado</label>
      <select id="eStatus">
        ${Object.entries(eventStatus).map(([v, t]) => `<option value="${v}" ${e.status === v ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
      <p class="muted">Solo los eventos publicados se ven y se venden en la web. Para frenar la venta, pasalo a borrador.</p>`;

  if (!id) {
    $('view').innerHTML = `
    <div class="card" style="max-width:620px;margin:auto">
      <h2>Crear evento</h2>
      <form onsubmit="submitEvent(event, null)">
        ${eventFields}
        <h3 style="margin-bottom:0">Tipos de entrada</h3>
        <p class="muted" style="margin-top:4px">Cada lote tiene su precio y su cantidad. Después los podés editar o agotar.</p>
        ${lotNamesList}
        <div id="lotRows"></div>
        <p><button type="button" class="ghost" onclick="addLotRow()">+ Agregar lote</button></p>
        <p><button>Publicar</button> <button type="button" class="ghost" onclick="go('events')">Cancelar</button></p>
      </form>
    </div>`;
    addLotRow('General');
    return;
  }

  $('view').innerHTML = `
  <div class="card" style="max-width:720px;margin:auto">
    <h2>Editar evento</h2>
    <form onsubmit="submitEvent(event, '${e.id}')">
      ${eventFields}
      <p><button>Guardar datos del evento</button> <button type="button" class="ghost" onclick="go('events')">Volver</button></p>
    </form>

    <h3>Tipos de entrada</h3>
    <p class="muted">Cambiar el precio o el nombre solo afecta las compras nuevas. “Vendidas” incluye las reservadas por compras que todavía no se pagaron.</p>
    ${e.lots.map(l => {
      const sold = l.quantity - l.ticketsAvailable;
      return `
      <div class="card" style="margin-bottom:10px">
        <div class="row lotrow">
          <div class="grow"><label>Lote</label><input id="lName_${l.id}" value="${esc(l.name)}" maxlength="60"></div>
          <div><label>Precio</label><input id="lPrice_${l.id}" type="number" min="0" step="0.01" value="${Number(l.price)}"></div>
          <div><label>Cantidad asignada</label><input id="lQty_${l.id}" type="number" min="${sold}" step="1" value="${l.quantity}"></div>
        </div>
        <p class="muted" style="margin:6px 0">Vendidas: <b>${sold}</b> · Disponibles: <b>${l.ticketsAvailable}</b>
          ${l.ticketsAvailable < 1 ? '<span class="tag soldout">Agotada</span>' : ''}</p>
        <button type="button" onclick="saveLot('${e.id}','${l.id}')">Guardar lote</button>
        <button type="button" class="ghost" ${l.ticketsAvailable < 1 ? 'disabled' : ''} onclick="soldOutLot('${e.id}','${l.id}')">Agotar</button>
        <button type="button" class="ghost danger" ${sold > 0 || e.lots.length < 2 ? 'disabled' : ''}
          title="${sold > 0 ? 'Ya tiene ventas: podés agotarlo' : e.lots.length < 2 ? 'El evento necesita al menos un lote' : ''}"
          onclick="deleteLotBtn('${e.id}','${l.id}')">Borrar</button>
      </div>`;
    }).join('')}

    <div class="card">
      <h4 style="margin:0">Agregar un lote</h4>
      ${lotNamesList}
      <div class="row lotrow">
        <div class="grow"><label>Lote</label><input id="nName" list="lotNames" maxlength="60" placeholder="EARLY, VIP…"></div>
        <div><label>Precio</label><input id="nPrice" type="number" min="0" step="0.01"></div>
        <div><label>Cantidad</label><input id="nQty" type="number" min="1" step="1"></div>
      </div>
      <button type="button" onclick="addLotBtn('${e.id}')">Agregar lote</button>
    </div>

    <h3>Packs con descuento</h3>
    <p class="muted">Promos por cantidad: el comprador elige “Pack x5” y recibe 5 entradas (cada una con su QR) con el % de descuento sobre el precio del lote. Por ejemplo, 5 entradas al 5% o 10 al 10%. Cambiar un pack solo afecta las compras nuevas.</p>
    ${(e.packs || []).map(p => `
    <div class="card" style="margin-bottom:10px">
      <div class="row lotrow">
        <div class="grow"><label>Tipo de entrada</label><select id="pLot_${p.id}">${packLotOptions(e, p.lotId)}</select></div>
        <div><label>Entradas por pack</label><input id="pQty_${p.id}" type="number" min="2" max="10" step="1" value="${p.quantity}"></div>
        <div><label>Descuento (%)</label><input id="pPct_${p.id}" type="number" min="0.01" max="90" step="0.01" value="${Number(p.discountPercent)}"></div>
      </div>
      <p class="muted" style="margin:6px 0">${packPreview(e, p)}</p>
      <button type="button" onclick="savePack('${e.id}','${p.id}')">Guardar pack</button>
      <button type="button" class="ghost danger" onclick="deletePackBtn('${e.id}','${p.id}')">Borrar</button>
    </div>`).join('') || '<p class="muted">Todavía no hay packs.</p>'}

    <div class="card">
      <h4 style="margin:0">Agregar un pack</h4>
      <div class="row lotrow">
        <div class="grow"><label>Tipo de entrada</label><select id="nPackLot">${packLotOptions(e)}</select></div>
        <div><label>Entradas por pack</label><input id="nPackQty" type="number" min="2" max="10" step="1" value="5"></div>
        <div><label>Descuento (%)</label><input id="nPackPct" type="number" min="0.01" max="90" step="0.01" value="5"></div>
      </div>
      <button type="button" onclick="addPackBtn('${e.id}')">Agregar pack</button>
    </div>
  </div>`;
}

const packLotOptions = (e, selected) => e.lots.map(l =>
  `<option value="${l.id}" ${l.id === selected ? 'selected' : ''}>${esc(l.name)} (${money(l.price)})</option>`).join('');
// "5 × $950 = $4.750 (antes $5.000)" para ver el precio final del pack
function packPreview(e, p) {
  const lot = e.lots.find(l => l.id === p.lotId);
  if (!lot) return '';
  const unit = Math.round(Number(lot.price) * (100 - Number(p.discountPercent))) / 100;
  return `Precio del pack: <b>${money(unit * p.quantity)}</b> (${p.quantity} × ${money(unit)}) · sin descuento ${money(lot.price * p.quantity)}`;
}


// Fila para cargar un lote (nombre, precio, cantidad) al crear el evento
function addLotRow(name = '') {
  const row = document.createElement('div');
  row.className = 'row lotrow';
  row.innerHTML = `
    <div class="grow"><label>Lote</label><input class="lName" list="lotNames" value="${esc(name)}" placeholder="EARLY, VIP…" required maxlength="60"></div>
    <div><label>Precio</label><input class="lPrice" type="number" min="0" step="0.01" required></div>
    <div><label>Cantidad</label><input class="lQty" type="number" min="1" step="1" required></div>
    <div class="fit"><button type="button" class="ghost danger" title="Quitar" onclick="removeLotRow(this)">✕</button></div>`;
  $('lotRows').appendChild(row);
}
function removeLotRow(btn) {
  if (document.querySelectorAll('#lotRows .lotrow').length < 2) return flash('El evento necesita al menos un lote', 'err');
  btn.closest('.lotrow').remove();
}

// ---------- Portada (drag & drop) ----------
// undefined = sin cambios, '' = quitada, otro valor = imagen nueva (data URL)
let coverData;
const COVER_MAX_WIDTH = 1600;

function coverDrag(ev, over) {
  ev.preventDefault();
  $('dropzone').classList.toggle('over', over);
}
function coverDrop(ev) {
  coverDrag(ev, false);
  setCover(ev.dataTransfer.files[0]);
}
// Se reduce en el navegador (máx. 1600 px de ancho, JPEG) para que pese poco y cargue rápido
function setCover(file) {
  if (!file) return;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return flash('La portada tiene que ser una imagen JPG, PNG o WebP', 'err');
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const scale = Math.min(1, COVER_MAX_WIDTH / img.width);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; // los PNG con transparencia no quedan negros
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    coverData = canvas.toDataURL('image/jpeg', 0.82);
    $('coverPrev').src = coverData;
    $('dropzone').classList.add('has-img');
    flash('');
  };
  img.onerror = () => { URL.revokeObjectURL(url); flash('No se pudo leer la imagen', 'err'); };
  img.src = url;
}
function removeCover() {
  coverData = '';
  $('coverPrev').removeAttribute('src');
  $('dropzone').classList.remove('has-img');
  $('coverFile').value = '';
}

async function submitEvent(ev, id) {
  ev.preventDefault();
  const body = {
    title: $('eTitle').value, description: $('eDesc').value,
    date: new Date($('eDate').value).toISOString(), location: $('eLoc').value,
    status: $('eStatus').value, organizerId: $('eOrganizer').value || null, minAge: $('eMinAge').value === '' ? null : Number($('eMinAge').value),
  };
  if (coverData !== undefined) body.imageUrl = coverData;
  // Al crear van los lotes. Al editar solo los datos del evento: los lotes (precio y
  // cupo) se editan aparte, así una venta en curso no se pisa con un número viejo
  if (!id) {
    body.lots = [...document.querySelectorAll('#lotRows .lotrow')].map(r => ({
      name: r.querySelector('.lName').value.trim(),
      price: Number(r.querySelector('.lPrice').value),
      quantity: Number(r.querySelector('.lQty').value),
    }));
  }
  try {
    await api(id ? '/events/' + id : '/events', { method: id ? 'PUT' : 'POST', auth: true, body });
    if (id) { await viewEdit(id); flash('Evento actualizado'); }
    else { go('events'); flash('Evento creado'); }
  } catch (err) { flash(err.message, 'err'); }
}

async function saveLot(eventId, lotId) {
  try {
    await api(`/events/${eventId}/lots/${lotId}`, { method: 'PUT', auth: true, body: {
      name: $('lName_' + lotId).value, price: Number($('lPrice_' + lotId).value), quantity: Number($('lQty_' + lotId).value),
    }});
    await viewEdit(eventId);
    flash('Lote actualizado');
  } catch (err) { flash(err.message, 'err'); }
}
async function addPackBtn(eventId) {
  try {
    await api(`/events/${eventId}/packs`, { method: 'POST', auth: true, body: {
      lotId: $('nPackLot').value, quantity: Number($('nPackQty').value), discountPercent: Number($('nPackPct').value),
    }});
    await viewEdit(eventId);
    flash('Pack agregado');
  } catch (err) { flash(err.message, 'err'); }
}
async function savePack(eventId, packId) {
  try {
    await api(`/events/${eventId}/packs/${packId}`, { method: 'PUT', auth: true, body: {
      lotId: $('pLot_' + packId).value, quantity: Number($('pQty_' + packId).value), discountPercent: Number($('pPct_' + packId).value),
    }});
    await viewEdit(eventId);
    flash('Pack actualizado');
  } catch (err) { flash(err.message, 'err'); }
}
async function deletePackBtn(eventId, packId) {
  if (!confirm('¿Borrar este pack? Las compras ya hechas no cambian.')) return;
  try {
    await api(`/events/${eventId}/packs/${packId}`, { method: 'DELETE', auth: true });
    await viewEdit(eventId);
    flash('Pack eliminado');
  } catch (err) { flash(err.message, 'err'); }
}
async function soldOutLot(eventId, lotId) {
  if (!confirm('¿Agotar este lote? Nadie podrá comprarlo hasta que vuelvas a subir la cantidad.')) return;
  try {
    await api(`/events/${eventId}/lots/${lotId}`, { method: 'PUT', auth: true, body: { soldOut: true } });
    await viewEdit(eventId);
    flash('Lote agotado');
  } catch (err) { flash(err.message, 'err'); }
}
async function deleteLotBtn(eventId, lotId) {
  if (!confirm('¿Borrar este lote?')) return;
  try {
    await api(`/events/${eventId}/lots/${lotId}`, { method: 'DELETE', auth: true });
    await viewEdit(eventId);
    flash('Lote eliminado');
  } catch (err) { flash(err.message, 'err'); }
}
async function addLotBtn(eventId) {
  try {
    if ($('nPrice').value === '') throw new Error('Completá el precio del lote');
    await api(`/events/${eventId}/lots`, { method: 'POST', auth: true, body: {
      name: $('nName').value, price: Number($('nPrice').value), quantity: Number($('nQty').value),
    }});
    await viewEdit(eventId);
    flash('Lote agregado');
  } catch (err) { flash(err.message, 'err'); }
}

// ---------- Compradores ----------
const purchaseStatus = { completed: 'Pagada', pending: 'Pendiente', failed: 'Rechazada', refunded: 'Reembolsada' };
let buyers = { event: null, purchases: [] };

async function viewBuyers(eventId) {
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    const [{ event }, { purchases }] = await Promise.all([
      api('/events/' + eventId, { auth: true }),
      api('/purchases/event/' + eventId, { auth: true }),
    ]);
    buyers = { event, purchases };
  } catch (err) { $('view').innerHTML = ''; return flash(err.message, 'err'); }

  const paid = buyers.purchases.filter(p => p.status === 'completed');
  const tickets = paid.flatMap(p => p.Tickets);
  const stat = (label, value) => `<div class="card stat"><div class="muted">${label}</div><div class="statv">${value}</div></div>`;

  $('view').innerHTML = `
  <h2>${esc(buyers.event.title)}</h2>
  <p class="muted">📅 ${new Date(buyers.event.date).toLocaleString('es-AR')} · 📍 ${esc(buyers.event.location)}</p>
  <div class="stats">
    ${stat('Entradas vendidas', tickets.length)}
    ${stat('Recaudado', money(paid.reduce((s, p) => s + Number(p.totalPrice), 0)))}
    ${stat('Ingresaron', `${tickets.filter(t => t.status === 'used').length} / ${tickets.length}`)}
    ${stat('Disponibles', buyers.event.ticketsAvailable)}
  </div>
  <div class="card">
    <div class="toolbar">
      <input id="bSearch" placeholder="Buscar por nombre, email o código" oninput="renderBuyers()">
      <select id="bFilter" onchange="renderBuyers()">
        <option value="completed">Pagadas</option>
        <option value="all">Todas</option>
        <option value="pending">Pendientes</option>
        <option value="failed">Rechazadas</option>
      </select>
      <button class="ghost" onclick="exportBuyersCsv()">Exportar CSV</button>
    </div>
    <div id="bList"></div>
  </div>
  <p><button class="ghost" onclick="go('events')">Volver a eventos</button>
     <button class="ghost" onclick="go('edit','${buyers.event.id}')">Editar evento</button></p>`;
  renderBuyers();
}

function renderBuyers() {
  const q = $('bSearch').value.trim().toLowerCase();
  const filter = $('bFilter').value;
  const list = buyers.purchases.filter(p =>
    (filter === 'all' || p.status === filter) &&
    (!q || [p.buyerName, p.buyerEmail, p.lotName || '', ...p.Tickets.map(t => t.code)].some(v => v.toLowerCase().includes(q)))
  );
  const time = (d) => new Date(d).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

  $('bList').innerHTML = list.length ? `
  <div class="table-wrap"><table>
    <thead><tr><th>Comprador</th><th>Entradas</th><th>Total</th><th>Estado</th><th>Fecha</th><th></th></tr></thead>
    <tbody>${list.map(p => `
      <tr>
        <td><b>${esc(p.buyerName)}</b><br><span class="muted">${esc(p.buyerEmail)}</span></td>
        <td>${p.quantity}${p.lotName ? ` · <b>${esc(p.lotName)}</b>` : ''}${p.Tickets.length ? `<br>${p.Tickets.map(t => `<span class="tag ${t.status}" title="${t.status === 'used' ? 'Ingresó a las ' + time(t.usedAt) : ''}">${esc(t.code)}${t.status === 'used' ? ' ✓' : ''}</span>`).join(' ')}` : ''}</td>
        <td>${money(p.totalPrice)}</td>
        <td><span class="tag ${p.status}">${purchaseStatus[p.status]}</span></td>
        <td class="muted">${new Date(p.createdAt).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })}</td>
        <td>${p.status === 'completed' ? `<a href="/#/entradas/${esc(p.accessToken)}" target="_blank" rel="noopener">Ver entradas</a>` : ''}</td>
      </tr>`).join('')}
    </tbody>
  </table></div>
  <p class="muted">${list.length} compra(s)</p>`
  : '<p class="muted">No hay compras que coincidan.</p>';
}

// Una fila por entrada: sirve de lista de respaldo en papel para la puerta
function exportBuyersCsv() {
  // Una celda que empieza con = + - @ la tomaría Excel como fórmula: se antepone ' para que sea texto
  const cell = (v) => {
    const s = String(v ?? '');
    return `"${(/^[=+\-@\t\r]/.test(s) ? "'" + s : s).replace(/"/g, '""')}"`;
  };
  const rows = [['Codigo', 'Lote', 'Estado entrada', 'Ingreso', 'Comprador', 'Email', 'Estado compra', 'Fecha compra']];
  for (const p of buyers.purchases) {
    for (const t of p.Tickets) {
      rows.push([t.code, t.lotName || p.lotName || '', t.status === 'used' ? 'Ingresó' : t.status === 'void' ? 'Anulada' : 'Válida',
        t.usedAt ? new Date(t.usedAt).toLocaleString('es-AR') : '', p.buyerName, p.buyerEmail,
        purchaseStatus[p.status], new Date(p.createdAt).toLocaleString('es-AR')]);
    }
  }
  const csv = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n'); // BOM + ; para que Excel lo abra bien
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `compradores-${buyers.event.title.replace(/[^\w-]+/g, '_')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- Pagos: cuentas de Mercado Pago y pausa de ventas ----------
async function viewPayments() {
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  let d;
  try { d = await api('/payment-accounts', { auth: true }); } catch (err) { $('view').innerHTML = ''; return flash(err.message, 'err'); }
  const active = d.accounts.find(a => a.active);
  const charging = d.provider !== 'mercadopago' ? `la pasarela <b>${esc(d.provider)}</b>`
    : active ? `<b>${esc(active.name)}</b> (…${esc(active.tokenHint)})`
    : d.envToken ? 'el token de las variables de entorno de Render' : '<b>ninguna cuenta</b>: no se puede cobrar';

  $('view').innerHTML = `
  <h2>Pagos</h2>
  <div class="card" style="margin-bottom:14px">
    <h3>Ventas ${d.salesPaused ? '<span class="tag failed">Pausadas</span>' : '<span class="tag completed">Abiertas</span>'}</h3>
    <p class="muted">Hoy se cobra con ${charging}.<br>
      Compras sin terminar de pagar: <b>${d.pendingPurchases}</b>. Las que ya están en curso se siguen confirmando con la cuenta con la que se crearon.</p>
    <p><button class="${d.salesPaused ? '' : 'danger'}" onclick="setSalesPaused(${!d.salesPaused})">${d.salesPaused ? 'Reanudar ventas' : 'Pausar ventas'}</button></p>
    <p class="muted">Para cambiar de cuenta: pausá las ventas, activá la otra cuenta y reanudá. Mientras estén pausadas nadie puede iniciar una compra nueva.</p>
  </div>

  <div class="card table-wrap" style="margin-bottom:14px">
    <h3>Cuentas de Mercado Pago</h3>
    ${d.provider !== 'mercadopago' ? `<p class="muted">La pasarela configurada es <b>${esc(d.provider)}</b>: las cuentas solo se usan con Mercado Pago.</p>` : ''}
    ${d.accounts.length ? `<table>
      <thead><tr><th>Cuenta</th><th>Token</th><th>Estado</th><th></th></tr></thead>
      <tbody>${d.accounts.map(a => `
        <tr>
          <td><b>${esc(a.name)}</b></td>
          <td class="muted">…${esc(a.tokenHint)}</td>
          <td>${a.active ? '<span class="tag completed">Activa</span>' : '<span class="tag">Inactiva</span>'}</td>
          <td style="white-space:nowrap">
            ${a.active ? '' : `<button class="ghost" ${d.salesPaused ? '' : 'disabled title="Pausá las ventas para cambiar de cuenta"'} onclick="activateAccount('${a.id}', this.dataset.name)" data-name="${esc(a.name)}">Activar</button>
            <button class="ghost danger" onclick="deleteAccount('${a.id}', this.dataset.name)" data-name="${esc(a.name)}">Borrar</button>`}
          </td>
        </tr>`).join('')}
      </tbody></table>` : '<p class="muted">Todavía no cargaste ninguna cuenta.</p>'}
  </div>

  <div class="card">
    <h3>Agregar una cuenta</h3>
    ${d.keyConfigured ? '' : '<p class="muted"><b>Falta configurar PAYMENT_ACCOUNTS_KEY</b> en Render (una frase larga y secreta): con ella se cifran los tokens. Sin esa variable no se pueden guardar cuentas.</p>'}
    <p class="muted">Usá el <b>Access Token de producción</b> de la aplicación de Mercado Pago de esa cuenta. Se verifica con Mercado Pago, se guarda cifrado y no se vuelve a mostrar.</p>
    <form onsubmit="submitAccount(event)">
      <label>Nombre (para reconocerla)</label><input id="aName" required maxlength="60" placeholder="Cuenta de Juan">
      <label>Access Token de producción</label><input id="aToken" type="password" required autocomplete="off">
      <p><button ${d.keyConfigured ? '' : 'disabled'}>Agregar cuenta</button></p>
    </form>
  </div>`;
}

async function submitAccount(ev) {
  ev.preventDefault();
  try {
    await api('/payment-accounts', { method: 'POST', auth: true, body: { name: $('aName').value, accessToken: $('aToken').value } });
    await viewPayments();
    flash('Cuenta agregada. Todavía no cobra: activala cuando quieras usarla.');
  } catch (err) { flash(err.message, 'err'); }
}
async function setSalesPaused(paused) {
  if (!paused || confirm('¿Pausar las ventas? Nadie va a poder iniciar compras hasta que las reanudes.')) {
    try {
      await api('/payment-accounts/sales-paused', { method: 'PUT', auth: true, body: { paused } });
      await viewPayments();
      flash(paused ? 'Ventas pausadas' : 'Ventas reanudadas');
    } catch (err) { flash(err.message, 'err'); }
  }
}
async function activateAccount(id, name) {
  if (!confirm(`¿Cobrar con ${name} desde ahora? Las compras en curso se siguen confirmando con la cuenta anterior.`)) return;
  try {
    await api(`/payment-accounts/${id}/activate`, { method: 'POST', auth: true });
    await viewPayments();
    flash(`Ahora se cobra con ${name}. Acordate de reanudar las ventas.`);
  } catch (err) { flash(err.message, 'err'); }
}
async function deleteAccount(id, name) {
  if (!confirm(`¿Borrar la cuenta ${name}?`)) return;
  try {
    await api('/payment-accounts/' + id, { method: 'DELETE', auth: true });
    await viewPayments();
    flash('Cuenta borrada');
  } catch (err) { flash(err.message, 'err'); }
}

// ---------- Usuarios staff ----------
async function viewUsers() {
  $('view').innerHTML = '<p class="muted">Cargando…</p>';
  let users, events;
  try {
    ({ users } = await api('/users', { auth: true }));
    ({ events } = await api('/events?limit=100', { auth: true }));
  } catch (err) { $('view').innerHTML = ''; return flash(err.message, 'err'); }
  userEvents = events;
  const eventName = (id) => (events.find(e => e.id === id) || { title: 'evento borrado' }).title;
  $('view').innerHTML = `
  <h2>Personal</h2>
  <div class="card" style="margin-bottom:14px">
    <h3>Agregar usuario</h3>
    <p class="muted"><b>Staff</b>: entra a <b>${esc(location.origin)}/staff</b> y escanea solo las entradas de los eventos que marques abajo (uno o varios).<br>
      <b>Organizador</b>: entra a <b>${esc(location.origin)}/organizador</b> y maneja solo los eventos que le asignes al crearlos o editarlos.</p>
    <form onsubmit="submitUser(event)">
      <div class="row">
        <div><label>Nombre</label><input id="uName" required placeholder="Puerta 1"></div>
        <div><label>Email</label><input id="uEmail" type="email" required></div>
      </div>
      <label>Rol</label>
      <select id="uRole" onchange="$('uEvents').style.display = this.value === 'staff' ? '' : 'none'"><option value="staff">Staff</option><option value="organizer">Organizador</option></select>
      <div id="uEvents">
        <label>Eventos del staff</label>
        ${events.length ? eventChecks('uEv', events, []) : '<p class="muted">Primero creá un evento.</p>'}
      </div>
      <label>Contraseña (mínimo 8 caracteres)</label>
      <input id="uPass" type="text" required minlength="8" autocomplete="new-password">
      <p><button>Agregar</button></p>
    </form>
  </div>
  <div class="card table-wrap">
    <table>
      <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Eventos</th><th></th></tr></thead>
      <tbody>${users.map(u => `
        <tr>
          <td><b>${esc(u.name)}</b></td>
          <td class="muted">${esc(u.email)}</td>
          <td><span class="tag">${{ admin: 'Admin', organizer: 'Organizador' }[u.role] || 'Staff'}</span></td>
          <td class="muted">${u.role === 'staff' ? (u.eventIds.length ? u.eventIds.map(id => esc(eventName(id))).join(', ') : '<b>Sin eventos: no puede escanear</b>') : u.role === 'organizer' ? esc(events.filter(e => e.organizerId === u.id).map(e => e.title).join(', ') || 'Sin eventos asignados') : 'Todos'}</td>
          <td style="white-space:nowrap">${u.role !== 'admin' ? `
            ${u.role === 'staff' ? `<button class="ghost" onclick="editStaffEvents('${u.id}')">Eventos</button>` : ''}
            <button class="ghost" onclick="resetPassword('${u.id}', this.dataset.name)" data-name="${esc(u.name)}">Cambiar contraseña</button>
            <button class="ghost danger" onclick="deleteUser('${u.id}', this.dataset.name)" data-name="${esc(u.name)}">Borrar</button>` : ''}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

let userEvents = [];

// Casillas de eventos (staff en varios eventos)
function eventChecks(prefix, events, selected) {
  return `<div class="card" style="max-height:180px;overflow:auto;padding:8px 12px">${events.map(e => `
    <label style="display:block;font-weight:normal"><input type="checkbox" name="${prefix}" value="${e.id}" ${selected.includes(e.id) ? 'checked' : ''}> ${esc(e.title)}</label>`).join('')}</div>`;
}
const checkedEvents = (prefix) => [...document.querySelectorAll(`input[name="${prefix}"]:checked`)].map(i => i.value);

async function submitUser(ev) {
  ev.preventDefault();
  const role = $('uRole').value;
  const eventIds = checkedEvents('uEv');
  if (role === 'staff' && !eventIds.length) return flash('Marcá al menos un evento para el staff', 'err');
  try {
    await api('/users', { method: 'POST', auth: true, body: { name: $('uName').value, email: $('uEmail').value, password: $('uPass').value, role, eventIds } });
    await viewUsers();
    flash('Usuario agregado. Pasale el email y la contraseña por un medio privado.');
  } catch (err) { flash(err.message, 'err'); }
}

// Cambiar en qué eventos trabaja un staff
async function editStaffEvents(id) {
  const { users } = await api('/users', { auth: true });
  const user = users.find(u => u.id === id);
  const box = document.createElement('div');
  box.className = 'card';
  box.style.margin = '14px 0';
  box.innerHTML = `<h3>Eventos de ${esc(user.name)}</h3>
    ${eventChecks('eEv', userEvents, user.eventIds)}
    <p><button id="saveEv">Guardar</button> <button class="ghost" id="cancelEv">Cancelar</button></p>`;
  $('view').prepend(box);
  box.scrollIntoView();
  $('cancelEv').onclick = () => box.remove();
  $('saveEv').onclick = async () => {
    const eventIds = checkedEvents('eEv');
    if (!eventIds.length) return flash('Marcá al menos un evento (o borrá al staff)', 'err');
    try {
      await api('/users/' + id, { method: 'PUT', auth: true, body: { eventIds } });
      await viewUsers();
      flash('Eventos actualizados');
    } catch (err) { flash(err.message, 'err'); }
  };
}

async function resetPassword(id, name) {
  const password = prompt(`Nueva contraseña para ${name} (mínimo 8 caracteres):`);
  if (!password) return;
  try {
    await api('/users/' + id, { method: 'PUT', auth: true, body: { password } });
    flash('Contraseña cambiada');
  } catch (err) { flash(err.message, 'err'); }
}

async function deleteUser(id, name) {
  if (!confirm(`¿Borrar a ${name}? Su sesión en el escáner se corta en el acto.`)) return;
  try {
    await api('/users/' + id, { method: 'DELETE', auth: true });
    await viewUsers();
    flash('Usuario borrado');
  } catch (err) { flash(err.message, 'err'); }
}

go('events');
</script>
